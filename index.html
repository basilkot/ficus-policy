<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Политики конфиденциальности</title>
    <style>
        :root {
            --primary: #009688;
            --primary-dark: #00796b;
            --text: #212121;
            --muted: #616161;
            --line: #e0e0e0;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 48px 18px;
            background: #fff;
            color: var(--text);
            font-family: -apple-system, Roboto, "Helvetica Neue", sans-serif;
            font-size: 16px;
            line-height: 1.6;
            -webkit-text-size-adjust: 100%;
        }
        main { max-width: 40rem; margin: 0 auto; }
        h1 { font-size: 24px; margin: 0 0 4px; }
        p { color: var(--muted); margin: 0 0 32px; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { border-top: 1px solid var(--line); }
        li:last-child { border-bottom: 1px solid var(--line); }
        a {
            display: block;
            padding: 16px 0;
            color: var(--primary-dark);
            text-decoration: none;
            font-weight: 600;
        }
        a:hover { text-decoration: underline; }
        a span { display: block; color: var(--muted); font-weight: 400; font-size: 14px; }
    </style>
</head>
<body>
<main>
    <h1>Политики конфиденциальности</h1>
    <p>Документы для приложений, которые я делаю.</p>
    <ul>
        <li>
            <a href="beauty-stuff/">Beauty Stuff для Android
                <span>Отслеживание сроков годности косметики</span>
            </a>
        </li>
        <li>
            <a href="beauty-stuff-ios/">Beauty Stuff для iPhone
                <span>То же приложение, но данные собираются иначе — документ отдельный</span>
            </a>
        </li>
    </ul>
</main>
</body>
</html>
